name: App | Publish to Stores

on:
  workflow_dispatch:
  push:
    branches:
    - production
    - staging

# # #

jobs:

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  version-number:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Version Number
        id: generate-version-number
        run: |
          vstring=$(npx @tmlmobilidade/repo-version --output=console)
          vcode=$(npx @tmlmobilidade/repo-version --output=console --format=code)
          echo "version_string=$vstring" >> "$GITHUB_OUTPUT"
          echo "version_code=$vcode" >> "$GITHUB_OUTPUT"
          echo "version_string: $vstring"
          echo "version_code: $vcode"
    outputs:
      version_string: ${{ steps.generate-version-number.outputs.version_string }}
      version_code: ${{ steps.generate-version-number.outputs.version_code }}

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  android:
    runs-on: ubuntu-latest
    needs: version-number
    steps:
      # # #
    - name: Checkout repository
      uses: actions/checkout@v5
      # # #
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
      # # #
    - name: Setup Expo and EAS
      uses: expo/expo-github-action@v7
      with:
        token: ${{ secrets.EXPO_TOKEN }}
        expo-version: latest
        eas-version: latest
        packager: npm
      # # #
    - name: Install dependencies
      run: npm install
      # # #
    - name: Bump package version
      run: npm version --no-git-tag-version ${{ needs.version-number.outputs.version_string }}
      # # #
    - name: Decode google-services.json
      run: |
        printf "%s" "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > ./environments/${{ github.ref_name }}/secrets/google-services.json
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      # # #
    - name: Build app
      run: |
        eas build --local \
          --non-interactive \
          --output=./app-build \
          --platform=android \
          --profile=${{ github.ref_name }}
      env:
        EXPO_PUBLIC_APP_VERSION_CODE: 145
      # # #
    - name: Submit to Google Play
      run: |
        eas submit -p android \
          --profile ${{ github.ref_name }} \
          --path app-build

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  ios:
    runs-on: macos-latest
    needs: version-number
    steps:
      # # #
    - name: Checkout repository
      uses: actions/checkout@v5
      # # #
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
      # # #
    - name: Setup Expo and EAS
      uses: expo/expo-github-action@v7
      with:
        token: ${{ secrets.EXPO_TOKEN }}
        expo-version: latest
        eas-version: latest
        packager: npm
      # # #
    - name: Install dependencies
      run: npm install
      # # #
    - name: Bump package version
      run: npm version --no-git-tag-version ${{ needs.version-number.outputs.version_string }}
      # # #
    - name: Build app
      run: |
        eas build --local \
          --non-interactive \
          --output=./app-build \
          --platform=ios \
          --profile=${{ github.ref_name }}
      env:
        EXPO_PUBLIC_APP_VERSION_CODE: ${{ needs.version-number.outputs.version_code }}
      # # #
    - name: Submit to Apple
      run: |
        eas submit -p ios \
          --profile ${{ github.ref_name }} \
          --path app-build
