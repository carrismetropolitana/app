name: App | Publish to Stores

on:
  workflow_dispatch:
  push:
    branches:
    - production
    - staging

# # #

jobs:

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  version-number:
    name: 'Version Number'
    runs-on: ubuntu-latest
    steps:
      - id: generate-version-number
        run: |
          version="$(date +%Y%m%d).$(date +%H%M).$(date +%S)"
          echo "Generated version: $version"
          echo "version_number=$version" >> "$GITHUB_OUTPUT"
    outputs:
      version_number: ${{ steps.generate-version-number.outputs.version_number }}

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  android:
    runs-on: ubuntu-latest
    needs: version-number
    steps:
      # # #
    - name: Checkout repository
      uses: actions/checkout@main
      # # #
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
      # # #
    - name: Setup Expo and EAS
      uses: expo/expo-github-action@v7
      with:
        token: ${{ secrets.EXPO_TOKEN }}
        expo-version: latest
        eas-version: latest
        packager: npm
      # # #
    - name: Install dependencies
      run: npm install
      # # #
    - name: Bump package version
      working-directory: packages/connectors
      run: npm version --no-git-tag-version ${{ needs.version-number.outputs.version_number }}
      # # #
    - name: Build app
      run: |
        eas build --local \
          --non-interactive \
          --output=./app-build \
          --platform=android \
          --profile=${{ github.ref_name }}
      # # #
    - name: Submit to Google Play
      run: |
        eas submit -p android \
          --profile ${{ github.ref_name }} \
          --path app-build

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  ios:
    runs-on: macos-latest
    needs: version-number
    steps:
      # # #
    - name: Checkout repository
      uses: actions/checkout@main
      # # #
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
      # # #
    - name: Setup Expo and EAS
      uses: expo/expo-github-action@v7
      with:
        token: ${{ secrets.EXPO_TOKEN }}
        expo-version: latest
        eas-version: latest
        packager: npm
      # # #
    - name: Install dependencies
      run: npm install
      # # #
    - name: Bump package version
      working-directory: packages/connectors
      run: npm version --no-git-tag-version ${{ needs.version-number.outputs.version_number }}
      # # #
    - name: Build app
      run: |
        eas build --local \
          --non-interactive \
          --output=./app-build \
          --platform=ios \
          --profile=${{ github.ref_name }}
      # # #
    - name: Submit to Apple
      run: |
        eas submit -p ios \
          --profile ${{ github.ref_name }} \
          --path app-build
