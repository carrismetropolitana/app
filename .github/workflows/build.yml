name: App | Publish to Stores

on:
  workflow_dispatch:
  push:
    branches:
    - production
    - staging

# # #

jobs:

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  version-number:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Version Number
        id: generate-version-number
        run: |
          version=$(npx @tmlmobilidade/repo-version --output=console)
          ios_build_number=$(npx @tmlmobilidade/repo-version --output=console --format=code)
          android_version_code=$(npx @tmlmobilidade/repo-version --output=console --format=code --limit=10)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ios_build_number=$ios_build_number" >> "$GITHUB_OUTPUT"
          echo "android_version_code=$android_version_code" >> "$GITHUB_OUTPUT"
          echo "version: $version"
          echo "ios_build_number: $ios_build_number"
          echo "android_version_code: $android_version_code"
    outputs:
      version: ${{ steps.generate-version-number.outputs.version }}
      ios_build_number: ${{ steps.generate-version-number.outputs.ios_build_number }}
      android_version_code: ${{ steps.generate-version-number.outputs.android_version_code }}

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  android:
    runs-on: ubuntu-latest
    needs: version-number
    steps:
      # # #
    - name: Checkout repository
      uses: actions/checkout@v5
      # # #
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
      # # #
    - name: Setup Expo and EAS
      uses: expo/expo-github-action@v7
      with:
        token: ${{ secrets.EXPO_TOKEN }}
        expo-version: latest
        eas-version: latest
        packager: npm
      # # #
    - name: Install dependencies
      run: npm install
      # # #
    - name: Bump package version
      run: npm version --no-git-tag-version ${{ needs.version-number.outputs.version }}
      # # #
    - name: Decode google-services.json
      run: |
        printf "%s" "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > ./environments/${{ github.ref_name }}/secrets/google-services.json
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      # # #
    - name: Build app
      run: |
        eas build --local \
          --non-interactive \
          --output=./app-build \
          --platform=android \
          --profile=${{ github.ref_name }}
      env:
        EXPO_PUBLIC_APP_IOS_BUILD_NUMBER: ${{ needs.version-number.outputs.ios_build_number }}
        EXPO_PUBLIC_APP_ANDROID_VERSION_CODE: ${{ needs.version-number.outputs.android_version_code }}
      # # #
    - name: Submit to Google Play
      run: |
        eas submit -p android \
          --profile ${{ github.ref_name }} \
          --path app-build

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  ios:
    runs-on: macos-latest
    needs: version-number
    steps:
      # # #
    - name: Checkout repository
      uses: actions/checkout@v5
      # # #
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
      # # #
    - name: Setup Expo and EAS
      uses: expo/expo-github-action@v7
      with:
        token: ${{ secrets.EXPO_TOKEN }}
        expo-version: latest
        eas-version: latest
        packager: npm
      # # #
    - name: List Xcode Versions
      run: |
        ls -la ~/Applications
      # # #
    - name: Install dependencies
      run: npm install
      # # #
    - name: Bump package version
      run: npm version --no-git-tag-version ${{ needs.version-number.outputs.version }}
      # # #
    - name: Build app
      run: |
        eas build --local \
          --non-interactive \
          --output=./app-build \
          --platform=ios \
          --profile=${{ github.ref_name }}
      env:
        EXPO_PUBLIC_APP_IOS_BUILD_NUMBER: ${{ needs.version-number.outputs.ios_build_number }}
        EXPO_PUBLIC_APP_ANDROID_VERSION_CODE: ${{ needs.version-number.outputs.android_version_code }}
      # # #
    - name: Submit to Apple
      run: |
        eas submit -p ios \
          --profile ${{ github.ref_name }} \
          --path app-build
