name: Build App

on:
  workflow_dispatch:
    inputs:
      os:
        type: choice
        description: OS to build on. Ubuntu is faster, MacOS supports iOS builds
        options:
          - macos-latest
          - ubuntu-latest
      platform:
        type: choice
        description: Platform to build for
        options:
          - android
          - ios
      profile:
        type: choice
        description: Build profile to use
        options:
          - development
          - preview
          - production
      should_submit:
        type: boolean
        description: Whether to perform the submit step
        required: true
        default: false
  push:
    branches:
      - production
      - staging

# # #

jobs:

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  build:
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write

    steps:

    - name: Checkout repository
      uses: actions/checkout@main

    - name: 🏗 Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: 🏗 Setup Expo and EAS
      uses: expo/expo-github-action@v7
      with:
        token: ${{ secrets.EXPO_TOKEN }}
        expo-version: latest
        eas-version: latest
        packager: npm

    - name: 📦 Install dependencies
      run: npm install

    - name: 👷 Build app
      run: |
        eas build --local \
          --non-interactive \
          --output=./app-build \
          --platform=ios \
          --profile=${{ github.ref_name }}
      env:
        EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
        EXPO_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

    - name: 🚢 Submit
      run: |
        eas submit -p ios \
          --profile ${{ github.ref_name }} \
          --path app-build
      env:
        EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
        EXPO_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}